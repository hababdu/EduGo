<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduGo" />
    <title>O'quv platformasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
      <script>
      // Birinchi chizishdan oldin mavzuni qo'llash (oq/qora "chaqnash" bo'lmasligi uchun)
      (function () {
        try {
          var p = localStorage.getItem('edugo.theme');
          var tg = window.Telegram && window.Telegram.WebApp;
          var sys = (tg && tg.colorScheme) || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = p === 'dark' || p === 'light' ? p : sys;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
