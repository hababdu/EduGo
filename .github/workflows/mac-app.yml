name: Mac App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/mac-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build DMG (imzosiz)
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: EduGo-mac
          path: desktop/dist/*.dmg
          if-no-files-found: error

      - name: Publish to Releases
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd desktop/dist && zip -q "$GITHUB_WORKSPACE/EduGo-mac.zip" *.dmg)
          gh release delete app-mac --yes --cleanup-tag || true
          gh release create app-mac EduGo-mac.zip --title "EduGo — Mac (zip)" --notes "Oxirgi build: ${{ github.sha }}"
