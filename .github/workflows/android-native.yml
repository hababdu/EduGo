name: Android Native (Kotlin)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-native.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build signed release (AAB + APK)
        if: ${{ secrets.EDUGO_KEYSTORE_BASE64 != '' }}
        env:
          KS_B64: ${{ secrets.EDUGO_KEYSTORE_BASE64 }}
          EDUGO_KEYSTORE_PASSWORD: ${{ secrets.EDUGO_KEYSTORE_PASSWORD }}
          EDUGO_KEY_ALIAS: ${{ secrets.EDUGO_KEY_ALIAS }}
          EDUGO_KEY_PASSWORD: ${{ secrets.EDUGO_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/edugo.keystore"
          EDUGO_KEYSTORE_PATH="$RUNNER_TEMP/edugo.keystore" ./gradlew assembleRelease bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EduGo-native-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to Releases
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk EduGo-native.apk
          gh release delete app-android-native --yes --cleanup-tag || true
          gh release create app-android-native EduGo-native.apk --title "EduGo — Android (Kotlin)" --notes "Oxirgi build: ${{ github.sha }}"
