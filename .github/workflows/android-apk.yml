name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Build web
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://edugo-5h4d.onrender.com' }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: EduGo-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish to Releases
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd frontend/android/app/build/outputs/apk/debug && zip -q "$GITHUB_WORKSPACE/EduGo-android.zip" app-debug.apk)
          gh release delete app-android --yes --cleanup-tag || true
          gh release create app-android EduGo-android.zip --title "EduGo — Android (zip)" --notes "Oxirgi build: ${{ github.sha }}"
